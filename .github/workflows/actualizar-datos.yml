name: Actualizar datos
# Cuando se edita datos/cambios.csv o datos/fuente.csv, regenera datos_heas.json y lo publica en main.
on:
  push:
    branches: [main]
    paths: ["datos/fuente.csv", "datos/cambios.csv"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generar datos_heas.json
        run: python tools/generar_datos.py datos/fuente.csv datos_heas.json
      - name: Publicar si hubo cambios
        run: |
          if git diff --quiet -- datos_heas.json; then echo "Sin cambios en los datos"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos_heas.json
          git commit -m "Datos: regenerado (fuente.csv + cambios.csv)"
          git push
